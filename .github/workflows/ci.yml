name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: pavaram/cicd-demo
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -v

      - name: Security scan (dependencies)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

  build-and-push:
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      pushed: ${{ steps.gate.outputs.pushed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker Hub secrets are configured
        id: gate
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::warning::Docker Hub secrets not configured, skipping build/push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.gate.outputs.pushed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        if: steps.gate.outputs.pushed == 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to Docker Hub
        if: steps.gate.outputs.pushed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: steps.gate.outputs.pushed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: Security scan (Docker image)
        if: steps.gate.outputs.pushed == 'true'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: ${{ env.DOCKER_IMAGE }}:sha-${{ github.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && needs.build-and-push.outputs.pushed == 'true'

    steps:
      - name: Deploy to EC2 (blue-green)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            IMAGE="${{ env.DOCKER_IMAGE }}:sha-${{ github.sha }}"
            CONTAINER_CURRENT="cicd-demo"
            CONTAINER_NEW="cicd-demo-blue"
            PORT_CURRENT=5000
            PORT_NEW=5001

            echo "--- Pulling image: $IMAGE"
            docker pull $IMAGE

            echo "--- Starting new container on port $PORT_NEW"
            docker rm -f $CONTAINER_NEW || true
            docker run -d \
              --name $CONTAINER_NEW \
              -p $PORT_NEW:5000 \
              --health-cmd="python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")'" \
              --health-interval=5s \
              --health-retries=3 \
              --health-timeout=3s \
              $IMAGE

            echo "--- Waiting for new container to become healthy..."
            for i in $(seq 1 12); do
              HEALTH=$(docker inspect --format='{{.State.Health.Status}}' $CONTAINER_NEW 2>/dev/null || echo "starting")
              if [ "$HEALTH" = "healthy" ]; then
                echo "New container is healthy!"
                break
              fi
              echo "  attempt $i/12 — status: $HEALTH"
              sleep 5
            done

            FINAL_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' $CONTAINER_NEW 2>/dev/null || echo "missing")
            if [ "$FINAL_HEALTH" != "healthy" ]; then
              echo "--- Healthcheck failed. Rolling back..."
              docker rm -f $CONTAINER_NEW || true
              echo "--- Rollback complete. Old container still running on port $PORT_CURRENT"
              exit 1
            fi

            echo "--- Swapping traffic: old -> port $PORT_NEW"
            docker stop $CONTAINER_CURRENT || true
            docker rm $CONTAINER_CURRENT || true
            docker run -d \
              --name $CONTAINER_CURRENT \
              -p $PORT_CURRENT:5000 \
              $IMAGE

            echo "--- Cleaning up blue container"
            docker rm -f $CONTAINER_NEW || true

            echo "--- Removing old images"
            docker image prune -f

            echo "--- Deployment successful!"
